# Control de calidad completo, una vez por semana y a mano: incluye notebooks lentos (LLM) y enlaces externos.
# Si algo falla, abre (o actualiza) un issue con el reporte.
name: semanal

on:
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC (03:17 en Buenos Aires)
  workflow_dispatch:
    inputs:
      estricto:
        description: "Los enlaces externos caídos hacen fallar"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  completo:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-fabrica.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache de modelos de Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('notebooks/*.ipynb') }}
          restore-keys: hf-

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-fabrica.txt
          python -m ipykernel install --user --name python3

      - name: Playwright y chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Chequeos (modo completo)
        id: chequeos
        run: |
          set +e
          python fabrica/chequeos/correr.py --reporte fabrica/reportes/reporte.md \
            ${{ inputs.estricto && '--estricto' || '' }}
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      - name: Reporte en el resumen del job
        if: always()
        run: cat fabrica/reportes/reporte.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Subir reporte y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semanal-${{ github.run_number }}
          path: |
            fabrica/reportes/reporte.md
            fabrica/reportes/trazabilidad.html
            fabrica/reportes/capturas/
          if-no-files-found: warn
          retention-days: 30

      - name: Abrir o actualizar issue si falla
        if: always() && steps.chequeos.outputs.codigo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create calidad --color d93f0b --description "Fallas del control de calidad semanal" 2>/dev/null || true
          {
            echo "La corrida semanal del $(date -u +%Y-%m-%d) encontró fallas. [Corrida y artefactos](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            if [ -f fabrica/reportes/reporte.md ]; then head -c 60000 fabrica/reportes/reporte.md; else echo "El chequeo no llegó a escribir el reporte."; fi
          } > issue.md
          abierto=$(gh issue list --label calidad --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --body-file issue.md
          else
            gh issue create --title "Calidad semanal: fallas ($(date -u +%Y-%m-%d))" --label calidad --body-file issue.md
          fi

      - name: Resultado
        if: always()
        run: |
          if [ "${{ steps.chequeos.outputs.codigo }}" != "0" ]; then
            echo "::error::Hay chequeos que fallan: ver el issue y el reporte."
            exit 1
          fi
